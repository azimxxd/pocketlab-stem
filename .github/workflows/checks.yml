name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  # Production deploy runs only for main and only after every check above has passed.
  deploy:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pocketlab-stem.vercel.app
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Require Vercel settings
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Set secret VERCEL_TOKEN and variables VERCEL_ORG_ID / VERCEL_PROJECT_ID (see README → Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Project settings are written here instead of `vercel pull`: pull needs account/team
      # access, while a least-privilege project-scoped token can still deploy. The project has
      # no custom environment variables; build settings mirror vercel.json.
      - name: Write Vercel project settings
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID","settings":{"framework":null,"installCommand":"npm ci","buildCommand":"npm run build","outputDirectory":"dist","rootDirectory":null,"nodeVersion":"24.x"}}
          JSON
      - run: npx --yes vercel@60 build --prod
      - run: npx --yes vercel@60 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
